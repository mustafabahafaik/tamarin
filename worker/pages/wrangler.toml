# Tamarin asistanı — Cloudflare Pages aracısı (Workers Free'nin parçası). Uygulama bu klasörü yüklemez.
# İstekleri servis bağlantısıyla asıl Worker'a (../wrangler.toml, "tamarin-asistan") iletir. Sır yok.
#   cd worker/pages && npx wrangler pages deploy
name = "tamarin-asistan"
pages_build_output_dir = "./public"
compatibility_date = "2026-11-01"

[[services]]
binding = "ASISTAN"
service = "tamarin-asistan"
